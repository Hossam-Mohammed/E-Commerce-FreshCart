<section class="py-4">
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-2.5">
      <span class="w-1.5 h-6 bg-emerald-600 rounded-full inline-block"></span>
      <h2 class="text-xl sm:text-2xl font-bold tracking-tight text-gray-900">
        Shop By <span class="text-emerald-600">Category</span>
      </h2>
    </div>

    <a routerLink="/categories"
      class="text-xs sm:text-sm font-semibold text-emerald-600 hover:text-emerald-700 transition-colors inline-flex items-center gap-1.5 group">
      <span>View All Categories</span>
      <i class="fa-solid fa-arrow-right text-xs group-hover:translate-x-1 transition-transform"></i>
    </a>
  </div>

  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 gap-3 sm:gap-4">
    @for(category of categories().slice(0, 8); track category._id) {
    <a [routerLink]="['/shop']" [queryParams]="{category: category._id}"
      class="bg-white border border-gray-100 hover:border-emerald-200 rounded-2xl p-4 flex flex-col items-center justify-between text-center shadow-2xs hover:shadow-md transition-all duration-200 group cursor-pointer">
      <div class="w-20 h-20 sm:w-22 sm:h-22 rounded-full bg-gray-50 group-hover:bg-emerald-50/50 p-2 overflow-hidden flex items-center justify-center transition-colors">
        <img class="w-full h-full object-cover rounded-full group-hover:scale-105 transition-transform duration-300"
          [src]="category.image" [alt]="category.name" [title]="category.slug">
      </div>
      <h3 class="text-xs sm:text-sm font-bold text-gray-800 group-hover:text-emerald-600 transition-colors mt-3 truncate w-full">
        {{ category.name }}
      </h3>
    </a>
    }
  </div>
</section>
