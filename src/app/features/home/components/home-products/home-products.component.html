<section class="py-6">
  <!-- Section Title -->
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-2.5">
      <span class="w-1.5 h-6 bg-emerald-600 rounded-full inline-block"></span>
      <h2 class="text-xl sm:text-2xl font-bold tracking-tight text-gray-900">
        Featured <span class="text-emerald-600">Products</span>
      </h2>
    </div>

    <a routerLink="/all-products"
      class="text-xs sm:text-sm font-semibold text-emerald-600 hover:text-emerald-700 transition-colors inline-flex items-center gap-1.5 group">
      <span>View All Products</span>
      <i class="fa-solid fa-arrow-right text-xs group-hover:translate-x-1 transition-transform"></i>
    </a>
  </div>

  <!-- Products Grid -->
  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-5">
    @for(product of products(); track product._id) {
    <div [routerLink]="['/p-details', product._id]"
      class="group relative bg-white border border-gray-100 hover:border-emerald-200 rounded-2xl p-3 sm:p-4 shadow-2xs hover:shadow-lg transition-all duration-300 flex flex-col justify-between cursor-pointer">
      
      <!-- Discount Badge (Top Left) -->
      <span class="absolute top-3 left-3 z-10 bg-red-500 text-white text-[11px] font-bold px-2 py-0.5 rounded-full shadow-xs">
        -{{ discountPercentages[$index % discountPercentages.length] }}%
      </span>

      <!-- Quick Action Icons (Top Right) -->
      <div class="absolute top-3 right-3 z-10 flex flex-col gap-1.5">
        <!-- Wishlist Button -->
        <button type="button" (click)="toggleWishlist(product._id, $event)"
          class="w-7 h-7 sm:w-8 sm:h-8 bg-white/90 backdrop-blur-xs hover:bg-white rounded-full border border-gray-100 shadow-xs flex items-center justify-center transition-all cursor-pointer hover:scale-110 active:scale-95"
          [attr.aria-label]="isProductInWishlist(product._id) ? 'Remove from Wishlist' : 'Add to Wishlist'">
          <i class="fa-heart text-xs sm:text-sm transition-colors"
            [class.fa-solid]="isProductInWishlist(product._id)"
            [class.text-red-500]="isProductInWishlist(product._id)"
            [class.fa-regular]="!isProductInWishlist(product._id)"
            [class.text-gray-400]="!isProductInWishlist(product._id)"></i>
        </button>

        <!-- Compare Button -->
        <button type="button" (click)="$event.stopPropagation()" aria-label="Compare"
          class="w-7 h-7 sm:w-8 sm:h-8 bg-white/90 backdrop-blur-xs hover:bg-white rounded-full border border-gray-100 shadow-xs flex items-center justify-center text-gray-400 hover:text-emerald-600 transition-all cursor-pointer hover:scale-110">
          <i class="fa-solid fa-arrows-rotate text-[11px]"></i>
        </button>

        <!-- Quick View / Eye Button -->
        <button type="button" (click)="$event.stopPropagation();" [routerLink]="['/p-details', product._id]" aria-label="Quick View"
          class="w-7 h-7 sm:w-8 sm:h-8 bg-white/90 backdrop-blur-xs hover:bg-white rounded-full border border-gray-100 shadow-xs flex items-center justify-center text-gray-400 hover:text-emerald-600 transition-all cursor-pointer hover:scale-110">
          <i class="fa-regular fa-eye text-[11px]"></i>
        </button>
      </div>

      <!-- Product Image -->
      <div class="w-full aspect-square flex items-center justify-center overflow-hidden mb-3 pt-2">
        <img [src]="product.imageCover" [alt]="product.title" [title]="product.slug"
          class="max-h-full max-w-full object-contain group-hover:scale-105 transition-transform duration-300">
      </div>

      <!-- Product Info -->
      <div class="space-y-1">
        <span class="text-[11px] sm:text-xs text-gray-400 font-medium block truncate">
          {{ product.category.name }}
        </span>
        <h3 class="text-xs sm:text-sm font-semibold text-gray-900 group-hover:text-emerald-600 transition-colors line-clamp-1"
          [title]="product.title">
          {{ product.title }}
        </h3>

        <!-- Rating -->
        <div class="flex items-center gap-1.5 pt-0.5">
          <div class="flex items-center text-amber-400 text-xs gap-0.5">
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star-half-stroke"></i>
          </div>
          <span class="text-[11px] text-gray-400 font-medium">
            {{ product.ratingsAverage }} ({{ 12 + ($index * 3) }})
          </span>
        </div>

        <!-- Price & Add to Cart Button -->
        <div class="flex items-center justify-between pt-2">
          <div class="flex items-baseline gap-1">
            <span class="text-sm sm:text-base font-extrabold text-gray-900">
              {{ product.price }}
            </span>
            <span class="text-xs font-semibold text-gray-500">EGP</span>
          </div>

          <button (click)="addToProduct(product._id, $event)" type="button" aria-label="Add to cart"
            class="w-8 h-8 rounded-full bg-emerald-600 hover:bg-emerald-700 active:scale-90 text-white flex items-center justify-center transition-all shadow-xs hover:shadow-md cursor-pointer">
            <i class="fa-solid fa-plus text-xs"></i>
          </button>
        </div>
      </div>

    </div>
    }
  </div>
</section>
